[project]
name = "applicant-evidence"
version = "0.1.0"
description = "Applicant outcome ingestion and explainable similarity retrieval"
requires-python = ">=3.11"

[project.scripts]
applicant-evidence = "admissions.cli:main"

[project.optional-dependencies]
documents = ["pypdf>=5.4,<7"]
essays = ["sentence-transformers>=3.0,<6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["admissions*"]
